blueprint:
  name: X20 Max - maintenance notifications
  description: >-
    Sends a custom notification action when one X20 Max reports a persistent
    station fault, enters the error state, becomes unavailable, or a
    detergent/consumable level drops below its threshold. Create one
    automation from this blueprint for each robot. Consumable alerts fire when
    a value crosses the threshold; values that are already below it when the
    automation is created, and changes reported right after Home Assistant
    starts or the robot reconnects, do not send a notification.
    Polski: powiadomienia serwisowe X20 Max; język treści wybierz w polu
    "Notification language / Język powiadomień".
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    robot_name:
      name: Robot name / Nazwa robota
      default: X20 Max
      selector:
        text:
    language:
      name: Notification language / Język powiadomień
      default: en
      selector:
        select:
          options:
            - label: English
              value: en
            - label: Polski
              value: pl
    vacuum:
      name: Vacuum entity / Encja odkurzacza
      description: The "Control" vacuum entity of this robot.
      selector:
        entity:
          filter:
            - integration: xiaomi_x20_max
              domain: vacuum
    station_alert:
      name: Station alerts sensor / Sensor alarmów stacji
      description: The "Station alerts" sensor of the same robot.
      selector:
        entity:
          filter:
            - integration: xiaomi_x20_max
              domain: sensor
    detergent:
      name: Detergent level sensor / Sensor poziomu detergentu
      description: The "Detergent level" sensor of the same robot.
      selector:
        entity:
          filter:
            - integration: xiaomi_x20_max
              domain: sensor
    mops:
      name: Mop life sensor / Sensor trwałości mopów
      description: The "Mop life" sensor of the same robot.
      selector:
        entity:
          filter:
            - integration: xiaomi_x20_max
              domain: sensor
    filter:
      name: Filter life sensor / Sensor trwałości filtra
      description: The "Filter life" sensor of the same robot.
      selector:
        entity:
          filter:
            - integration: xiaomi_x20_max
              domain: sensor
    main_brush:
      name: Main brush life sensor / Sensor trwałości szczotki głównej
      description: The "Main brush life" sensor of the same robot.
      selector:
        entity:
          filter:
            - integration: xiaomi_x20_max
              domain: sensor
    side_brush:
      name: Side brush life sensor / Sensor trwałości szczotki bocznej
      description: The "Side brush life" sensor of the same robot.
      selector:
        entity:
          filter:
            - integration: xiaomi_x20_max
              domain: sensor
    dust_bag:
      name: Dust bag life sensor / Sensor trwałości worka na kurz
      description: The "Dust bag life" sensor of the same robot.
      selector:
        entity:
          filter:
            - integration: xiaomi_x20_max
              domain: sensor
    notification_actions:
      name: Notification action / Akcja powiadomienia
      description: >-
        Add a notification action. Templates may use x20_title, x20_message
        and x20_robot_name.
      selector:
        action:

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input station_alert
    not_from:
      - unavailable
      - unknown
    to: Problem
    for: "00:01:00"
    id: station
  - trigger: state
    entity_id: !input vacuum
    not_from:
      - unavailable
      - unknown
    to: error
    id: vacuum_error
  - trigger: state
    entity_id: !input vacuum
    to: unavailable
    for: "00:02:00"
    id: unavailable
  - trigger: numeric_state
    entity_id: !input detergent
    below: 15
    id: detergent
  - trigger: numeric_state
    entity_id: !input mops
    below: 20
    id: mops
  - trigger: numeric_state
    entity_id: !input filter
    below: 20
    id: filter
  - trigger: numeric_state
    entity_id: !input main_brush
    below: 20
    id: main_brush
  - trigger: numeric_state
    entity_id: !input side_brush
    below: 20
    id: side_brush
  - trigger: numeric_state
    entity_id: !input dust_bag
    below: 20
    id: dust_bag

conditions:
  # A value that only reappears after a cloud outage, a restart or an
  # integration reload is not a new event; notify only on real changes.
  - condition: template
    value_template: >-
      {{ trigger.id == 'unavailable'
         or (trigger.from_state is not none
             and trigger.from_state.state not in ['unavailable', 'unknown']) }}

variables:
  configured_robot_name: !input robot_name
  language: !input language
  station_alert_entity: !input station_alert

actions:
  - variables:
      pl: "{{ language == 'pl' }}"
      item: >-
        {% set names = {
          'detergent': ['detergent', 'detergent'],
          'mops': ['mops', 'mopy'],
          'filter': ['filter', 'filtr'],
          'main_brush': ['main brush', 'szczotka główna'],
          'side_brush': ['side brush', 'szczotka boczna'],
          'dust_bag': ['dust bag', 'worek na kurz']
        } %}
        {{ names.get(trigger.id, ['robot', 'robot'])[1 if pl else 0] }}
      remaining_hours: >-
        {{ trigger.to_state.attributes.get('remaining_hours')
           if trigger.to_state is not none else none }}
      percent: >-
        {{ trigger.to_state.state if trigger.to_state is not none else '' }}
      station_problem: >-
        {{ state_attr(station_alert_entity, 'problem') or '' }}
      x20_robot_name: "{{ configured_robot_name }}"
      x20_title: >-
        {% set titles = {
          'station': ['Cleaning: Station problem', 'Sprzątanie: Problem ze stacją'],
          'vacuum_error': ['Cleaning: Robot error', 'Sprzątanie: Błąd robota'],
          'unavailable': ['Cleaning: Robot not responding',
                          'Sprzątanie: Robot nie odpowiada'],
          'detergent': ['Cleaning: Low detergent', 'Sprzątanie: Mało detergentu']
        } %}
        {{ titles.get(trigger.id, ['Cleaning: Item wear',
                                   'Sprzątanie: Zużycie elementu'])[1 if pl else 0] }}
      detail: >-
        {% set h = remaining_hours %}
        {% set hours = h not in [none, '', 'None'] %}
        {% set name = configured_robot_name %}
        {% set problem = trigger.to_state.attributes.get('problem')
           if trigger.to_state is not none else none %}
        {% if trigger.id == 'station' %}
          {{ ('Stacja robota ' if pl else 'Station of robot ') ~ name ~ ': '
             ~ (problem or station_problem) }}
        {% elif trigger.id == 'vacuum_error' %}
          {{ ('Robot ' ~ name ~ ' zgłosił błąd. ' if pl
              else 'Robot ' ~ name ~ ' reported an error. ') ~ station_problem }}
        {% elif trigger.id == 'unavailable' %}
          {{ 'Robot ' ~ name ~ (' nie odpowiada od 2 minut.' if pl
             else ' has not responded for 2 minutes.') }}
        {% elif trigger.id == 'detergent' and pl %}
          {{ 'Pozostało ' ~ percent ~ ' % detergentu robota ' ~ name
             ~ ((' — około ' ~ h ~ ' godz. pracy') if hours else '') ~ '.' }}
        {% elif trigger.id == 'detergent' %}
          {{ percent ~ ' % of detergent left for robot ' ~ name
             ~ ((' — about ' ~ h ~ ' operating hours') if hours else '') ~ '.' }}
        {% elif pl %}
          {{ (item | capitalize) ~ ' robota ' ~ name ~ ': pozostało ' ~ percent
             ~ ' %' ~ ((' — około ' ~ h ~ ' godz. pracy') if hours else '') ~ '.' }}
        {% else %}
          {{ (item | capitalize) ~ ' of robot ' ~ name ~ ': ' ~ percent ~ ' % left'
             ~ ((' — about ' ~ h ~ ' operating hours') if hours else '') ~ '.' }}
        {% endif %}
      todo: >-
        {% set texts = {
          'station': ["Check the robot's station.", 'Sprawdź stację robota.'],
          'vacuum_error': ['Check the robot and the station.',
                           'Sprawdź robota i stację.'],
          'unavailable': ['Check that the robot and the station have power and '
                          'network access.',
                          'Sprawdź, czy robot i stacja mają zasilanie oraz '
                          'dostęp do sieci.'],
          'detergent': ['Refill the detergent in the station.',
                        'Uzupełnij detergent w stacji.']
        } %}
        {{ texts.get(trigger.id, ['Clean or replace the item, then reset its '
                                  'counter.',
                                  'Wyczyść lub wymień element, a potem wyzeruj '
                                  'jego licznik.'])[1 if pl else 0] }}
      x20_message: "{{ (detail | trim) ~ '\n' ~ todo }}"
  - sequence: !input notification_actions
