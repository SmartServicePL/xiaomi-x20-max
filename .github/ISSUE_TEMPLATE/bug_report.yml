name: Bug report
description: Report a reproducible integration problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Never attach tokens, Xiaomi credentials or Home Assistant `.storage` files.
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: home_assistant
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: X20 Max firmware
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs or diagnostics
      render: text
